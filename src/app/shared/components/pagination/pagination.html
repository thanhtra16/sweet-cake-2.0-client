@if (totalPages() > 1) {
  <nav class="sc-pagination" aria-label="Phân trang">
    <button type="button" class="sc-pagination__item" [disabled]="page() <= 1"
            aria-label="Trang trước" (click)="go(page() - 1)">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    @for (p of pages(); track $index) {
      @if (p === null) {
        <span class="sc-pagination__gap" aria-hidden="true">…</span>
      } @else {
        <button type="button" class="sc-pagination__item" [class.is-active]="p === page()"
                [attr.aria-current]="p === page() ? 'page' : null" (click)="go(p)">
          {{ p }}
        </button>
      }
    }

    <button type="button" class="sc-pagination__item" [disabled]="page() >= totalPages()"
            aria-label="Trang sau" (click)="go(page() + 1)">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </nav>
}
