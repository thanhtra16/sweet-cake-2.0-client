<div class="admin-shell">
  <aside class="admin-sidebar" aria-label="Điều hướng quản trị">
    <div class="admin-brand">
      <span class="admin-brand__name">SweetCake</span>
      <span class="admin-brand__sub">Quản trị cửa hàng</span>
    </div>

    <nav class="admin-nav">
      @for (item of navItems; track item.link) {
        <a class="admin-nav__item" [routerLink]="item.link" routerLinkActive="is-active">
          <i class="fa-solid" [class]="item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="admin-profile">
      <div class="admin-profile__row">
        <span class="admin-avatar" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
        <div>
          <strong class="admin-profile__name">{{ adminName }}</strong>
          <span class="admin-profile__role">Quản trị viên</span>
        </div>
      </div>
      <button type="button" class="admin-logout" (click)="logout()">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Đăng xuất
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-topbar">
      <p class="admin-crumbs">
        <span>Trang quản trị</span>
        @if (pageTitle()) {
          <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
          <strong>{{ pageTitle() }}</strong>
        }
      </p>
    </header>

    <main class="admin-content">
      <router-outlet />
    </main>
  </div>

  <app-toast />
</div>
