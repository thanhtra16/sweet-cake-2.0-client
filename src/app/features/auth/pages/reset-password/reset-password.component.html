<main class="khu-vuc-dang-ky">
  <div class="the-dang-ky">
    <h1 class="tieu-de-vua">Thiết Lập Mật Khẩu Mới</h1>
    <p class="chu-thuong phu-de-dang-ky">Hãy chọn một mật khẩu mạnh để bảo vệ hành trình ngọt ngào của bạn.</p>

    <form class="form-dang-ky" novalidate (ngSubmit)="submit()">
      <div class="nhom-truong">
        <label class="nhan-truong" for="mat-khau-moi">Mật khẩu mới</label>
        <div class="khung-mat-khau">
          <input
            class="dong-nhap-lieu"
            [type]="showNew() ? 'text' : 'password'"
            id="mat-khau-moi"
            name="mat-khau-moi"
            placeholder="Nhập mật khẩu mới"
            autocomplete="new-password"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
          />
          <button
            type="button"
            class="nut-an-hien-mat-khau"
            [attr.aria-label]="showNew() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            (click)="showNew.set(!showNew())"
          >
            <i class="bi" [class.bi-eye]="!showNew()" [class.bi-eye-slash]="showNew()"></i>
          </button>
        </div>
      </div>

      <div class="nhom-truong">
        <label class="nhan-truong" for="xac-nhan-mat-khau">Xác nhận lại mật khẩu</label>
        <div class="khung-mat-khau">
          <input
            class="dong-nhap-lieu"
            [class.dong-nhap-lieu-loi]="confirmError()"
            [type]="showConfirm() ? 'text' : 'password'"
            id="xac-nhan-mat-khau"
            name="xac-nhan-mat-khau"
            placeholder="Xác nhận lại mật khẩu"
            autocomplete="new-password"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
          />
          <button
            type="button"
            class="nut-an-hien-mat-khau"
            [attr.aria-label]="showConfirm() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            (click)="showConfirm.set(!showConfirm())"
          >
            <i class="bi" [class.bi-eye]="!showConfirm()" [class.bi-eye-slash]="showConfirm()"></i>
          </button>
        </div>
        @if (confirmError()) { <p class="chu-loi">{{ confirmError() }}</p> }
      </div>

      <div class="khoi-yeu-cau-mat-khau">
        <div class="dong-yeu-cau" [class.dat-yeu-cau]="rules().length">
          <i class="bi icon-yeu-cau" [class.bi-check-circle-fill]="rules().length" [class.bi-check-circle]="!rules().length"></i>
          <span>Ít nhất 8 ký tự</span>
        </div>
        <div class="dong-yeu-cau" [class.dat-yeu-cau]="rules().upper">
          <i class="bi icon-yeu-cau" [class.bi-check-circle-fill]="rules().upper" [class.bi-check-circle]="!rules().upper"></i>
          <span>Ít nhất 1 chữ hoa</span>
        </div>
        <div class="dong-yeu-cau" [class.dat-yeu-cau]="rules().digit">
          <i class="bi icon-yeu-cau" [class.bi-check-circle-fill]="rules().digit" [class.bi-check-circle]="!rules().digit"></i>
          <span>Ít nhất 1 con số</span>
        </div>
      </div>

      @if (formError()) { <p class="chu-loi thong-bao-loi-chung">{{ formError() }}</p> }

      <button type="submit" class="nut-bam nut-dang-ky" [disabled]="!canSubmit()">
        @if (success()) { ĐÃ ĐỔI MẬT KHẨU! }
        @else if (loading()) { ĐANG LƯU... }
        @else { Hoàn tất &amp; đăng nhập lại }
      </button>
    </form>

    <p class="lien-ket-dong"><a routerLink="/">Về trang chủ</a></p>
  </div>
</main>
