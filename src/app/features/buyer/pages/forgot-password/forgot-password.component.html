<main class="khu-vuc-dang-ky">
  <div class="the-dang-ky">
    <h1 class="tieu-de-vua">Khôi Phục Mật Khẩu</h1>
    <p class="chu-thuong phu-de-dang-ky">Vui lòng nhập số điện thoại để nhận mã xác thực.</p>

    <form class="form-dang-ky" novalidate (ngSubmit)="submit()">
      <div class="nhom-truong">
        <label class="nhan-truong" for="phone">Số điện thoại</label>
        <input
          #phoneInput
          class="dong-nhap-lieu"
          [class.dong-nhap-lieu-loi]="error()"
          type="tel"
          id="phone"
          name="phone"
          placeholder="090 1234 567"
          autocomplete="tel"
          [ngModel]="phone()"
          (ngModelChange)="onPhoneChange($event)"
        />
        @if (error()) { <p class="chu-loi">{{ error() }}</p> }
      </div>

      <button type="submit" class="nut-bam nut-dang-ky" [disabled]="loading()">
        @if (loading()) { ĐANG GỬI... } @else { GỬI MÃ XÁC THỰC }
      </button>
    </form>

    <p class="lien-ket-quay-lai"><a routerLink="/auth/login">Quay lại Đăng nhập</a></p>

    <div class="khoi-trich-dan">
      <p>“Ngọt ngào từ những chiếc bánh luôn chờ đợi bạn. Đừng lo lắng, chúng tôi sẽ giúp bạn trở lại gian bếp của SweetCake ngay thôi.”</p>
    </div>
  </div>
</main>
