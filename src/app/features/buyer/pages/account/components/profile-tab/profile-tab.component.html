<h2 class="acc-main-title">Thông tin tài khoản</h2>

<form novalidate (ngSubmit)="submit()">
  <div class="acc-form-grid">
    <div class="acc-form-group">
      <label class="acc-label" for="fullName">Họ tên</label>
      <input
        class="dong-nhap-lieu" [class.dong-nhap-lieu-loi]="errors().fullName"
        type="text" id="fullName" name="fullName" autocomplete="name"
        [ngModel]="fullName()" (ngModelChange)="fullName.set($event); clearError('fullName')"
      />
      @if (errors().fullName) { <p class="chu-loi">{{ errors().fullName }}</p> }
    </div>

    <div class="acc-form-group">
      <label class="acc-label" for="phone">Số điện thoại</label>
      <input class="dong-nhap-lieu" type="tel" id="phone" name="phone" [value]="phone" readonly />
      <p class="chu-goi-y">Số điện thoại là tên đăng nhập nên không thể thay đổi.</p>
    </div>

    <div class="acc-form-group">
      <label class="acc-label" for="email">Email</label>
      <input
        class="dong-nhap-lieu" [class.dong-nhap-lieu-loi]="errors().email"
        type="email" id="email" name="email" autocomplete="email" placeholder="sweetcake@gmail.com"
        [ngModel]="email()" (ngModelChange)="email.set($event); clearError('email')"
      />
      @if (errors().email) { <p class="chu-loi">{{ errors().email }}</p> }
    </div>

    <div class="acc-form-group">
      <label class="acc-label" for="birthday">Ngày sinh</label>
      <input
        class="dong-nhap-lieu" [class.dong-nhap-lieu-loi]="errors().birthday"
        type="date" id="birthday" name="birthday" [max]="today"
        [ngModel]="birthday()" (ngModelChange)="birthday.set($event); clearError('birthday')"
      />
      @if (errors().birthday) { <p class="chu-loi">{{ errors().birthday }}</p> }
    </div>
  </div>

  @if (errors().form) { <p class="chu-loi thong-bao-form">{{ errors().form }}</p> }

  <div class="acc-form-actions">
    <button type="button" class="btn-phu" [disabled]="!dirty() || loading()" (click)="reset()">Hủy thay đổi</button>
    <button type="submit" class="btn-chinh" [disabled]="!dirty() || loading()">
      @if (loading()) { Đang lưu... } @else { Lưu thông tin }
    </button>
  </div>
</form>
