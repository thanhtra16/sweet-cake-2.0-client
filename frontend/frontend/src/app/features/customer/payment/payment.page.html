<section class="payment sc-container">
  <h1>Thanh toán đơn hàng</h1>
  <p *ngIf="message" class="payment__message" role="status">{{ message }}</p>
  <article class="sc-card payment__card" *ngIf="order; else loading">
    <p>Mã đơn hàng: <strong>{{ order.code }}</strong></p><p>Số tiền: <strong>{{ formatVnd(order.total) }}</strong></p>
    <div class="payment__qr" *ngIf="currentAttempt?.qrDataUrl"><img [src]="currentAttempt.qrDataUrl" alt="Mã QR thanh toán" /><p>Quét mã QR để thanh toán</p></div>
    <p class="payment__timer" [class.is-expired]="secondsLeft === 0">{{ secondsLeft > 0 ? 'Mã QR hết hạn sau ' + timeLabel : 'Mã QR đã hết hạn' }}</p>
    <button class="sc-btn sc-btn--primary" type="button" (click)="recreateQr()" [disabled]="loadingQr || secondsLeft > 0 || order.payment?.status === 'paid'">{{ loadingQr ? 'Đang tạo...' : 'Tạo lại mã QR' }}</button>
    <p *ngIf="order.payment?.status === 'paid'">Đã thanh toán thành công.</p>
  </article>
  <ng-template #loading><p>Đang tải thông tin đơn hàng...</p></ng-template>
</section>
